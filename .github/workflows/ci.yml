name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The job only reads the repository, so the token gets read access and nothing else.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` type-checks (tsc -b) and then builds with Vite.
      - name: Build
        run: npm run build

      # Runs the Vitest suite (the waitlist form and backend handoff tests).
      - name: Tests
        run: npm test

      # Local links, launch claims, client-facing copy, the waitlist handoff
      # and the product design contract.
      - name: Source and launch contracts
        run: npm run check:source-contracts

      # Fails the run when a dependency has a known vulnerability of moderate
      # severity or higher (npm audit --audit-level=moderate).
      - name: Dependency audit
        run: npm run check:dependency-audit
